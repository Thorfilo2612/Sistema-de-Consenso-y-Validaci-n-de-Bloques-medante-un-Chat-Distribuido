<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Network node icon: central node + connections -->
  <rect width="32" height="32" fill="#0a0e27"/>
  <!-- Connections -->
  <line x1="16" y1="16" x2="6" y2="8"  stroke="#00d4ff" stroke-width="1.5" opacity="0.6"/>
  <line x1="16" y1="16" x2="26" y2="8"  stroke="#00d4ff" stroke-width="1.5" opacity="0.6"/>
  <line x1="16" y1="16" x2="6" y2="24" stroke="#06ffa5" stroke-width="1.5" opacity="0.6"/>
  <line x1="16" y1="16" x2="26" y2="24" stroke="#ff006e" stroke-width="1.5" opacity="0.6"/>
  <!-- Peripheral nodes -->
  <circle cx="6"  cy="8"  r="2.5" fill="#00d4ff" opacity="0.8"/>
  <circle cx="26" cy="8"  r="2.5" fill="#00d4ff" opacity="0.8"/>
  <circle cx="6"  cy="24" r="2.5" fill="#06ffa5" opacity="0.8"/>
  <circle cx="26" cy="24" r="2.5" fill="#ff006e" opacity="0.8"/>
  <!-- Central node -->
  <circle cx="16" cy="16" r="4" fill="#00d4ff"/>
</svg>
